group 'dev.bessems.usbserial'
version '1.0'

// O UsbSerial do felHR85 só existe no JitPack, e quem resolve as dependências
// transitivas da lib é o app: por isso o repositório vai para todos os projetos.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 16
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
